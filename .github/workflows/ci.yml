name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      NODE_ENV: "test"
      MODERATOR_SECRET: "ci_secret_mod_token"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies & prepare Prisma
        working-directory: server
        run: |
          npm install
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run server test suite
        working-directory: server
        run: npm test

      - name: Build server distribution
        working-directory: server
        run: npm run build

      - name: Install client dependencies & verify build
        working-directory: client
        run: |
          npm install
          npm run build
