name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies & prepare Prisma
        run: |
          cd server
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run server test suite
        run: |
          cd server
          npm test

      - name: Build server distribution
        run: |
          cd server
          npm run build

      - name: Install client dependencies & verify build
        run: |
          cd client
          npm ci
          npm run build

