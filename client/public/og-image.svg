<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Central Shield Badge -->
  <g transform="translate(100, 190)">
    <path d="M70 20L20 45V90C20 135 48 178 70 190C92 178 120 135 120 90V45L70 20Z" fill="url(#shieldGrad)" stroke="#d8b4fe" stroke-width="4"/>
    <path d="M70 135L64 129C46 112 34 101 34 87C34 76 42 68 53 68C59 68 65 71 69 76H71C75 71 81 68 87 68C98 68 106 76 106 87C106 101 94 112 76 129L70 135Z" fill="#fbbf24"/>
  </g>

  <!-- Typography -->
  <text x="260" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Her Voice</text>
  <text x="260" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#d8b4fe">“Your story matters. Your identity is yours to protect.”</text>
  <text x="260" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa">Open-source platform for women's safety, anonymous support &amp; verified reporting.</text>

  <!-- Badge Strip -->
  <g transform="translate(260, 430)">
    <rect width="180" height="42" rx="10" fill="#3b0764" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="90" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e9d5ff" text-anchor="middle">Anonymous Feed</text>
  </g>
  <g transform="translate(460, 430)">
    <rect width="180" height="42" rx="10" fill="#3b0764" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="90" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e9d5ff" text-anchor="middle">Reality Simulator</text>
  </g>
  <g transform="translate(660, 430)">
    <rect width="180" height="42" rx="10" fill="#3b0764" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="90" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#e9d5ff" text-anchor="middle">Saathi AI Companion</text>
  </g>
  <g transform="translate(860, 430)">
    <rect width="200" height="42" rx="10" fill="#450a0a" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="100" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fca5a5" text-anchor="middle">Emergency 112 Ready</text>
  </g>

  <!-- Bottom Brand info -->
  <text x="100" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#71717a">hervoice.org • Open-Source Initiative • 100% Non-Commercial</text>
</svg>

